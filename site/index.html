*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;font-weight:420;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.wrap{max-width:var(--w);margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:640px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* type roles: serif = section headings, condensed = CTA/labels, sans = body */
.h-display{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7vw,104px);line-height:.95;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5vw,72px);line-height:1;margin:0;text-wrap:balance}
.h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.4vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.h3{font-family:var(--sans);font-weight:680;font-size:20px;line-height:1.2;margin:0}
.eyebrow{font-family:var(--sans);font-stretch:50%;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:clamp(17px,1.6vw,20px);line-height:1.5;max-width:62ch;margin:0;font-weight:450}
.body{max-width:65ch;margin:0;color:var(--ink-2)}
.small{font-size:13px;color:var(--muted)}
.meta{font-family:var(--sans);font-stretch:50%;font-weight:620;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--surface)}
.hdr-in{display:flex;align-items:center;gap:24px;min-height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.mark{width:34px;height:36px;background:currentColor;-webkit-mask:url("img/74f1211f01ba.png") center/contain no-repeat;mask:url("img/74f1211f01ba.png") center/contain no-repeat}
.wordmark{font-family:var(--sans);font-weight:800;font-size:19px;letter-spacing:.02em;white-space:nowrap}
@media (max-width:640px){.hdr-in>.tag{display:none}}
.nav{display:flex;gap:24px;margin-left:auto}
.nav button,.util button{background:none;border:0;padding:6px 0;cursor:pointer;font-weight:620;font-size:16px;border-bottom:2px solid transparent}
.nav button[aria-current="page"]{border-bottom-color:var(--ink)}
.util{display:flex;gap:18px;align-items:center;padding-left:24px;border-left:1px solid var(--line)}
.util button{font-size:14px;font-weight:500;color:var(--muted)}
.util button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer}
.icon-btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.burger{display:none}
@media (max-width:1200px){.nav,.util{display:none}.burger{display:grid;margin-left:auto}}

/* mobile menu */
.mmenu{position:fixed;inset:0;z-index:70;background:var(--surface);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.mmenu .row{display:flex;justify-content:space-between;align-items:center}
.mmenu nav{display:flex;flex-direction:column;margin-top:24px;border-top:1px solid var(--line)}
.mmenu nav button{all:unset;cursor:pointer;font-family:var(--serif);font-size:34px;padding:14px 0;border-bottom:1px solid var(--line)}
.mmenu .mutil{display:flex;gap:20px;margin-top:20px}
.mmenu .mutil button{all:unset;cursor:pointer;font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--sans);font-stretch:50%;font-weight:760;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;border-radius:var(--r);min-height:46px}
.btn.solid{background:var(--ink);color:var(--surface)}
.btn:hover{background:var(--ink);color:var(--surface)}
.btn.solid:hover{background:var(--ink-2)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;background:transparent;color:var(--ink)}
.btn.solid[disabled]{background:var(--ink);color:var(--surface)}
.btn.light{border-color:#fff;color:#fff}
.btn.light:hover{background:#fff;color:var(--ink)}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.arrow::after{content:"→";font-stretch:100%}
.btns{display:flex;flex-wrap:wrap;gap:12px}

/* sections */
.sec{padding-block:72px;border-bottom:1px solid var(--line-2)}
.sec.tight{padding-block:48px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin-bottom:32px}
.sec-head>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.split>*{min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
@media (max-width:960px){.split{grid-template-columns:1fr;gap:28px}.g4,.g5,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* placeholders + photos */
.ph{background:var(--ph);color:var(--ph-ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:13px;font-weight:520;position:relative;width:100%;max-width:100%;border-radius:var(--r);background-image:linear-gradient(135deg,transparent 49.6%,rgba(0,0,0,.06) 50%,transparent 50.4%),linear-gradient(45deg,transparent 49.6%,rgba(0,0,0,.06) 50%,transparent 50.4%)}
.ph span{max-width:30ch}
.ph.dark{background-color:#3a3b37;color:#a9aaa4}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
.photo{width:100%;max-width:100%;object-fit:cover;border-radius:var(--r);background:var(--ph);cursor:zoom-in}
figcaption{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

/* labels */
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11.5px;font-weight:650;letter-spacing:.02em;line-height:1;padding:4px 7px;border-radius:2px;white-space:nowrap;cursor:help;vertical-align:middle;font-stretch:100%;text-transform:none}
.tag.fake{background:var(--note-bg);color:var(--note);border:1px dashed var(--note-line)}
.tag.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #b9d7bd}
.tag.none{background:#eee;color:#555;border:1px solid #ccc}
.tag.stage{background:var(--stage-bg);color:var(--stage);border:1px solid #bccbe6}
.tag.v11{background:#f1efe9;color:#5e5a4c;border:1px solid #d6d1c2}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-stretch:50%;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border:1px solid currentColor;border-radius:2px;background:transparent;cursor:help}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.muted{color:var(--muted);border-color:var(--muted)}
.badge.dashed{border-style:dashed}
.badge.filled{background:var(--ink);color:var(--surface)}

/* annotations */
.note{background:var(--note-bg);border:1px dashed var(--note-line);color:var(--note);font-size:13px;line-height:1.45;padding:10px 12px;border-radius:2px;max-width:100%}
.note b{font-weight:750;margin-right:4px}
body.no-notes .note,body.no-notes .tag.fake,body.no-notes .tag.ok,body.no-notes .tag.none,body.no-notes .tag.v11,body.no-notes .tag.stage,body.no-notes .unap{display:none!important}
.unap{background:var(--unap-bg);border-bottom:1px solid #f0c2bd;color:var(--unap)}
.unap .wrap{display:flex;gap:12px;align-items:flex-start;padding-block:14px;font-size:14px}
.unap strong{font-weight:780;white-space:nowrap}
.state-bar{background:var(--surface);border-bottom:1px solid var(--line)}
.state-bar .wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:12px}
.state-bar .lbl{font-size:13px;font-weight:700;color:var(--note)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* tooltip */
.tip{position:fixed;z-index:120;max-width:min(280px,calc(100vw - 16px));background:#1b1c1a;color:#fff;font:500 12.5px/1.4 var(--sans);font-stretch:100%;letter-spacing:0;text-transform:none;padding:8px 10px;border-radius:3px;white-space:normal;text-align:left;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* hero */
.hero{position:relative;background:#2b2c29;color:#fff;min-height:min(78vh,760px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hero .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.hero:has(.hero-img)::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 60%)}
.hero .note{z-index:1}
.hero .ph{position:absolute;inset:0;border-radius:0;background-color:#3a3b37;color:#a3a49e;align-items:flex-start;padding-top:28px}
.hero .wrap{position:relative;z-index:1;width:100%;min-width:0;padding-block:64px}
.hero .h-display{font-size:clamp(36px,9.5vw,104px);overflow-wrap:anywhere}
.hero .note{position:absolute;right:max(24px,env(safe-area-inset-right,0px));top:24px;max-width:340px}
@media (max-width:640px){.hero .note{position:relative;right:auto;top:auto;max-width:none;margin:88px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}}

/* cards */

.box{background:var(--surface);border:1px solid var(--line);padding:24px;border-radius:var(--r);display:flex;flex-direction:column;gap:12px;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;font-size:14px;font-weight:600;border-radius:2px;cursor:pointer}

.hr{height:1px;background:var(--line);border:0;margin:0}
.kv{display:grid;grid-template-columns:160px 1fr;gap:10px 20px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
@media (max-width:600px){.kv{grid-template-columns:1fr}}

.form{display:flex;flex-direction:column;gap:20px;max-width:640px}
.sec .form:not(:has(.row-inline)){background:var(--surface);border:1px solid var(--line);padding:clamp(20px,3vw,36px);border-radius:var(--r)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-family:var(--sans);font-stretch:50%;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.field label .small{text-transform:none;letter-spacing:0;font-stretch:100%;font-weight:450}
.field .hint{font-size:13px;color:var(--muted)}
.inp{border:1px solid var(--line);background:#f7f7f5;padding:14px 16px;border-radius:var(--r);min-height:54px;width:100%;font-size:16px;transition:border-color .15s,background-color .15s,box-shadow .15s}
.inp::placeholder{color:#9a9c96}
.inp:hover{border-color:#a9aba5}
.inp:focus{outline:none;background:var(--surface);border-color:var(--ink);box-shadow:0 0 0 3px rgba(27,28,26,.12)}

textarea.inp{min-height:132px;resize:vertical;line-height:1.5}
.inp[aria-invalid="true"]{border-color:var(--err);background:var(--unap-bg);box-shadow:0 0 0 3px rgba(162,38,28,.12)}
.form button[type=submit]{align-self:flex-start;min-width:200px;justify-content:center}
.row-inline button[type=submit]{min-width:0}
.err{display:flex;gap:6px;align-items:flex-start;color:var(--err);font-size:13px;font-weight:600}
.err::before{content:"!";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--err);color:#fff;font-size:11px;font-weight:800;flex:none;margin-top:1px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check{line-height:1.45;color:var(--ink-2)}
.check input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:1px 0 0;flex:none;border:1.5px solid var(--ink-2);border-radius:2px;background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:background-color .15s}
.check input::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.check input:checked{background:var(--ink);border-color:var(--ink)}
.check input:checked::after{opacity:1}
.check input[aria-invalid="true"]{border-color:var(--err);box-shadow:0 0 0 3px rgba(162,38,28,.12)}
.result{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1.5px solid;border-radius:var(--r);font-size:15px}
.result.ok{border-color:var(--succ);color:var(--succ);background:var(--ok-bg)}
.result.bad{border-color:var(--err);color:var(--err);background:var(--unap-bg)}
.result.info{border-color:var(--ink-2);background:var(--surface)}
.result b{display:block;margin-bottom:2px}
.sim{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sim select{border:1px solid var(--note-line);background:#fff;padding:4px 6px;font-size:12.5px;color:var(--note)}
.row-inline{display:flex;flex-wrap:wrap;gap:12px}
.row-inline .inp{flex:1 1 240px;min-width:0}
.sz{display:flex;flex-wrap:wrap;gap:8px}
.sz button{min-width:48px;height:44px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;cursor:pointer;border-radius:2px}
.sz button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sz button[disabled]{text-decoration:line-through;opacity:.45;cursor:not-allowed}

/* footer */
.ftr{background:var(--dark);color:var(--dark-ink);padding-block:64px 32px;font-size:15px}
.ftr .cols{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:40px}
@media (max-width:960px){.ftr .cols{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.ftr .cols{grid-template-columns:1fr}}
.ftr h4{margin:0 0 12px;color:#fff;font-family:var(--sans);font-stretch:50%;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.ftr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ftr button{all:unset;cursor:pointer}
.ftr button:hover{color:#fff;text-decoration:underline}
.ftr button:focus-visible{outline:2px solid #fff}
.emblem{width:92px;height:145px;background:currentColor;-webkit-mask:url("img/bb166b8d8615.png") center/contain no-repeat;mask:url("img/bb166b8d8615.png") center/contain no-repeat;color:#e9eae5}
.ftr .bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-top:1px solid #3c3d39;margin-top:48px;padding-top:20px;font-size:13px}

/* modal + drawer + toast */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(20,21,19,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);width:min(640px,100%);max-height:100%;overflow:auto;border-radius:3px;padding:28px;display:flex;flex-direction:column;gap:16px;position:relative}
.modal.wide{width:min(1040px,100%)}
.modal>*,.drawer>*{flex-shrink:0}
.modal .x{position:absolute;right:14px;top:14px}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:81;width:min(420px,100%);background:var(--surface);padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 24px;display:flex;flex-direction:column;gap:16px;box-shadow:-8px 0 30px rgba(0,0,0,.2);overflow:auto}

.toggle{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle input{width:44px;height:24px;accent-color:var(--ink);flex:none}

/* prototype toolbar */
.proto{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;gap:6px;align-items:center;background:#1b1c1a;color:#fff;padding:6px;border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.3);max-width:calc(100% - 24px)}
.proto button{background:transparent;color:#fff;border:0;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap}

.sitemap button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2);padding:9px 0;cursor:pointer;font-weight:600;font-size:15px}
.sitemap button:hover{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px}

.acc{border-top:1px solid var(--line)}

.acc summary::after{content:"+";font-size:22px;line-height:1}
.acc details[open] summary::after{content:"–"}
.acc .a{padding:0 0 18px;max-width:65ch;color:var(--ink-2)}
.timeline{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.timeline>div{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.timeline>div{grid-template-columns:1fr}}
.count{display:flex;gap:12px;flex-wrap:wrap}

.count span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.player{position:relative;aspect-ratio:16/9;max-width:100%;background:#2f302c;color:#b9bab4;display:grid;place-items:center;border-radius:var(--r);cursor:pointer;border:0;width:100%}
.player .play{width:76px;height:76px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center}
.player .play::before{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
.player .cap{position:absolute;left:16px;bottom:14px;font-size:13px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.steps>div{counter-increment:s;border-top:2px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps>div::before{content:counter(s);font-family:var(--serif);font-size:32px;line-height:1}

.table-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:560px;font-size:15px;background:var(--surface)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top}
table.t th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.legal{display:grid;grid-template-columns:240px 1fr;gap:48px}
.legal>*{min-width:0}
@media (max-width:860px){.legal{grid-template-columns:1fr}}
.line{height:11px;background:var(--line-2);border-radius:2px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;font-weight:700}
.skip:focus{top:12px}
.price{font-family:var(--serif);font-size:30px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.plogos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.plogo{display:grid;place-items:center;aspect-ratio:3/2;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:relative;min-width:0;transition:border-color .15s}
.plogo:hover{border-color:currentColor}
.plogo img{position:absolute;inset:14%;width:72%;height:72%;object-fit:contain;display:block}

figure.miss{position:relative}

// ---------- forms ----------
const SIM = `<div class="sim note"><b>Перевірити відповідь форми:</b><select data-sim aria-label="Simulate server response"><option value="ok">Успіх</option><option value="dup">Вже підписаний / дублікат</option><option value="err">Помилка сервера</option><option value="off">Форма недоступна</option></select></div>`;
function bindForms(root=document){
  $$("form[data-form]",root).forEach(f=>{ if(f.dataset.bound) return; f.dataset.bound=1; f.addEventListener("submit",onSubmit); });
}
function onSubmit(e){
  e.preventDefault();
  const f=e.currentTarget;
  $$(".err",f).forEach(x=>x.remove()); $$("[aria-invalid]",f).forEach(x=>x.removeAttribute("aria-invalid"));
  let bad=null;
  $$("[required]",f).forEach(inp=>{
    let msg="";
    if(inp.type==="checkbox"){ if(!inp.checked) msg=inp.dataset.msg||"Please confirm to continue"; }
    else if(!inp.value.trim()) msg=inp.dataset.msg||"This field is required";
    else if(inp.type==="email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(inp.value)) msg="Enter a valid email address, for example name@example.com";
    if(msg){
      inp.setAttribute("aria-invalid","true");
      const er=document.createElement("div"); er.className="err"; er.setAttribute("role","alert"); er.textContent=msg;
      if(inp.type==="checkbox") inp.closest(".check").after(er);
      else (inp.closest(".field")||inp.parentElement).appendChild(er);
      bad=bad||inp;
    }
  });
  if(bad){ bad.focus(); return; }
  const b=f.querySelector("button[type=submit]"); const label=b.textContent;
  b.disabled=true; b.textContent="Sending…";
  const sim=(f.parentElement.querySelector("[data-sim]")||{}).value||"ok";
  setTimeout(()=>{
    b.disabled=false; b.textContent=label;
    const box=f.parentElement.querySelector(".form-result")||(()=>{const d=document.createElement("div");d.className="form-result";d.setAttribute("aria-live","polite");f.after(d);return d})();
    const okText=f.dataset.ok||"Thank you. We have received your request.";
    if(sim==="ok"){ box.innerHTML=`<div class="result ok"><span>✓</span><div><b>${okText}</b>${f.dataset.ok2||""}</div></div>`; f.hidden=true; }
    else if(sim==="dup"){ box.innerHTML=`<div class="result info"><span>i</span><div><b>You’re already on the list</b>We did not create a duplicate. Nothing else to do.</div></div>`; }
    else if(sim==="err"){ box.innerHTML=`<div class="result bad"><span>!</span><div><b>Something went wrong</b>Your data was not saved. Please try again in a minute.</div></div>`; }
    else { box.innerHTML=`<div class="result info"><span>i</span><div><b>This form is temporarily unavailable</b>You can still follow the team on Instagram and YouTube.</div></div>`; f.hidden=true; }
  },900);
}
const consent = (id,text)=>`<label class="check"><input id="${id}" type="checkbox" required data-msg="Please confirm to continue"><span>${text} <button type="button" class="link" data-go="legal-privacy">Privacy Notice</button></span></label>`;
const fld = (id,label,type="text",req=true,hint="",extra="")=>`<div class="field"><label for="${id}">${label}${req?"":" <span class='small'>(optional)</span>"}</label>${type==="textarea"?`<textarea class="inp" id="${id}" ${req?"required":""} ${extra}></textarea>`:`<input class="inp" id="${id}" type="${type}" ${req?"required":""} ${extra} ${type==="email"?'autocomplete="email"':""}>`}${hint?`<span class="hint">${hint}</span>`:""}</div>`;
function emailForm(id,cta,consentText,okText,ok2=""){

function lightbox(key){
  const keys=$$("[data-lightbox]").map(i=>i.dataset.lightbox); let i=Math.max(0,keys.indexOf(key));
  const show=()=>{ const k=keys[i]; openModal(`<figure><img src="${pic(k)}" alt="${esc(palt(k))}" style="width:100%;max-height:70vh;object-fit:contain;background:#111"><figcaption><span>${esc(palt(k))}</span><span>Photo: ${credit()}</span><span class="small">${i+1} / ${keys.length}</span></figcaption></figure><div class="btns"><button class="btn" data-act="lb" data-d="-1">← Previous</button><button class="btn" data-act="lb" data-d="1">Next →</button></div>${note("Фото відкривається на весь екран. Гортайте кнопками. Під кожним фото — автор.")}`,true); };
  window._lb=d=>{ i=(i+d+keys.length)%keys.length; show(); };
  show();
}

// ---------- global events ----------
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){ e.preventDefault(); closeMenu(); closeModal(); const [id,anchor]=g.dataset.go.split("#"); go(id,anchor); return; }
  const lb=e.target.closest("[data-lightbox]"); if(lb){ lightbox(lb.dataset.lightbox); return; }
  const st=e.target.closest("[data-state]"); if(st){ S[st.dataset.state]=st.dataset.val; thPost({type:"site-state",key:st.dataset.state,val:st.dataset.val}); const y=scrollY; render(); window.scrollTo(0,y); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act;
  if(act==="close") closeModal();
  else if(act==="menu") openMenu();
  else if(act==="menu-close") closeMenu();
  else if(act==="sitemap") sitemap();
  else if(act==="notes"){ S.notes=!S.notes; document.body.classList.toggle("no-notes",!S.notes); a.textContent=S.notes?"Примітки: увімк.":"Примітки: вимк."; }
  else if(act==="photos"){ S.photos=nzOn()?"indo":"nazare"; a.innerHTML=`<span class="pfx">Фото: </span>${nzOn()?"Назаре":"Індонезія"}`; render(); }
  else if(act==="cookie"){ store.set("th-cookie",a.dataset.v); $(".cookie")&&$(".cookie").remove(); closeModal(); toast(a.dataset.v==="accept"?"All cookies accepted":a.dataset.v==="save"?"Cookie choices saved":"Only essential cookies are on"); }
  else if(act==="cookie-settings") cookieSettings();
  else if(act==="cookie-reset"){ try{sessionStorage.removeItem("th-cookie")}catch(e){} cookieBanner(); toast("Cookie banner shown again"); }
  else if(act==="ext") openModal(`<h2 class="h2">External link</h2><p class="body">This opens the official ${esc(a.dataset.url)} page of TAKE HIGH in a new tab.</p>${note("У прототипі зовнішні посилання не відкриваються. На сайті вони відкриються в новій вкладці.")}`);
  else if(act==="follow") openModal(`<h2 class="h2">${COPY.follow}</h2><p class="body">Follow the team’s season on our official channels.</p>${fake("Підзаголовок")}<div class="btns"><button class="btn" data-act="ext" data-url="Instagram">Instagram ↗</button><button class="btn" data-act="ext" data-url="YouTube">YouTube ↗</button></div>${note("Кнопка «Follow the ride» веде на соцмережі команди.")}`);
  else if(act==="lb") window._lb(+a.dataset.d);
  else if(act==="crew") crewModal(a.dataset.id);
  else if(act==="press-form") pressForm();
  else if(act==="remind") remindModal();
  else if(act==="player") playerModal(a.dataset.kind);
  else if(act==="sizeguide") sizeGuide();
  else if(act==="notify") notifyModal(a.dataset.name);
  else if(act==="cart-add") cartAdd(a.dataset.slug);
  else if(act==="cart") cartDrawer();
  else if(act==="cart-rm"){ S.cart.splice(+a.dataset.i,1); cartDrawer(); }
  else if(act==="filter"){ S.filter=a.dataset.v; const y=scrollY; render(); window.scrollTo(0,y); }
  else if(act==="tag"){ const t=a.dataset.v; S.tags=S.tags.includes(t)?S.tags.filter(x=>x!==t):[...S.tags,t]; const y=scrollY; render(); window.scrollTo(0,y); }
  else if(act==="size"){ S.size=a.dataset.v; $$("[data-act=size]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.size)); }
  else if(act==="zero"){ S.countdownTarget=Date.now()+3000; toast("Countdown reaches zero in 3 seconds"); }
  else if(act==="toggle"){ S[a.dataset.k]=!S[a.dataset.k]; const y=scrollY; render(); window.scrollTo(0,y); }
  else if(act==="download") toast("Download available after approval");
  else if(act==="load-more") toast("No more updates yet");
});

// ---------- tooltips: placed inside the viewport, flip below when no room above ----------
let tipEl=null, tipFor=null;
function showTip(t){
  hideTip(); tipFor=t;
  tipEl=document.createElement("div"); tipEl.className="tip"; tipEl.setAttribute("role","tooltip"); tipEl.textContent=t.dataset.tip;
  document.body.appendChild(tipEl);
  const r=t.getBoundingClientRect(), w=tipEl.offsetWidth, h=tipEl.offsetHeight, vw=document.documentElement.clientWidth, vh=innerHeight, gap=8;
  const top = r.top-h-gap>=gap ? r.top-h-gap : Math.min(r.bottom+gap, vh-h-gap);
  const left = Math.max(gap, Math.min(r.left+r.width/2-w/2, vw-w-gap));
  tipEl.style.top=top+"px"; tipEl.style.left=left+"px";
}
function hideTip(){ if(tipEl){ tipEl.remove(); tipEl=null; tipFor=null; } }
document.addEventListener("mouseover",e=>{ const t=e.target.closest("[data-tip]"); if(t&&t!==tipFor) showTip(t); else if(!t) hideTip(); });
document.addEventListener("focusin",e=>{ const t=e.target.closest("[data-tip]"); t?showTip(t):hideTip(); });
document.addEventListener("focusout",hideTip);
window.addEventListener("scroll",hideTip,{passive:true});
document.addEventListener("click",hideTip,true);

// ---------- countdown ----------
setInterval(()=>{
  const el=$("#cd"); if(!el) return;
  const d=Math.max(0,S.countdownTarget-Date.now());
  if(d===0){ el.innerHTML=`<div class="result ok" style="width:100%"><span>●</span><div><b>The premiere is live</b>Watch TAKE HIGH on YouTube now.</div></div><button class="btn solid arrow" data-act="ext" data-url="YouTube Premiere">Watch the premiere</button>${note("Коли таймер доходить до нуля, замість нього з’являється кнопка.")}`; el.id="cd-done"; return; }
  const p=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
  $$("#cd b").forEach((b,i)=>b.textContent=String(p[i]).padStart(2,"0"));
},1000);

<script>
// Дані з адмінки: завантаження з Dropbox і автоматичне оновлення після кожної зміни
(function () {
  if (!window.THStorage) return;
  var last = JSON.stringify(window.__TH_SITE_DATA || null);
  function push(d) { var j = JSON.stringify(d); if (j === last) return; last = j; window.postMessage({ th: 1, type: 'data', data: d }, '*'); }
  THStorage.load().then(function (r) { if (r.data) push(r.data); else if (window.TH_DEFAULT) push(window.TH_DEFAULT); })
    .catch(function (e) { console.warn('[TAKE HIGH] дані не завантажено:', e.message, e.detail || ''); });
  THStorage.watch(push);
})();
</script>
